<!-- Inside your checkout.html -->
<button id="rzp-button1" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
    Pay & Get Audit
</button>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "rzp_live_SBhTeV8COgZ5KV", // <-- REPLACE WITH YOUR KEY
    "amount": "99900", // Amount in paise (99900 = ₹999)
    "currency": "INR",
    "name": "Sree Gonesh Info Arts",
    "description": "Website Growth Audit",
    "handler": function (response){
        // Redirect to thank you page after successful payment
        window.location.href = "thank-you.html";
    },
    "prefill": {
        "name": "Customer Name",
        "email": "customer@example.com",
        "contact": "9999999999"
    },
    "theme": {
        "color": "#2563eb"
    }
};
var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
