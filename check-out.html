<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 py-10 px-4">
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold mb-2">Claim Your Audit</h2>
        <p class="text-gray-600 mb-6">Fill in details to get your custom growth report.</p>
        
        <form action="thank-you.html" class="space-y-4">
            <div>
                <label class="block text-sm font-medium">Business Name</label>
                <input type="text" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium">WhatsApp Number</label>
                <input type="tel" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium">Website URL (if any)</label>
                <input type="text" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Get My Free Audit</button>
        </form>
        
        <div class="mt-6 flex items-center justify-center gap-2 text-sm text-gray-500">
            <i class="fas fa-lock"></i> 100% Secure & Private
        </div>
    </div>
</body>
</html>
